name: CI

# Every gate here is blocking. The repository previously carried ruff, mypy,
# bandit, pytest and coverage configuration but had no CI at all, so 739 lint
# violations and 10 type errors accumulated against its own declared rulesets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Test with branch coverage
        # Throughput floors are measured by the dedicated `performance` job:
        # coverage tracing slows pure-Python loops several-fold and would make
        # them a test of the tracer.
        run: |
          pytest tests/ -m "not performance" \
            --cov --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

  security:
    name: security
    # AUD-DEF-10 / APGI-API-003 / APGI-IMP-001: audit the dependency set that is
    # actually released — the built wheel plus its declared runtime extras,
    # resolved into a clean environment — not the environment that merely holds
    # the scanning tools. The resolved lock, SBOM and scan reports are retained
    # as artifacts for the candidate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip build
          pip install bandit[toml] pip-audit cyclonedx-bom detect-secrets

      - name: Bandit
        run: bandit -r . -c bandit.yaml -ll --exclude ./tests,./build,./.venv

      - name: Build the release wheel
        run: python -m build --wheel

      - name: Resolve the released dependency set into a clean environment
        # The `estimation` extra (PyMC) is excluded: it requires numpy>=2, which
        # the released package caps below (see DEPENDENCY-MATRIX.md).
        run: |
          python -m venv /tmp/release-env
          /tmp/release-env/bin/pip install --upgrade pip
          /tmp/release-env/bin/pip install "$(ls dist/*.whl)[sci,analysis,reservoir]"
          /tmp/release-env/bin/pip freeze --exclude-editable | grep -v '^apgi' > release-lock.txt
          sha256sum dist/*.whl > release-artifacts.sha256
          cat release-lock.txt

      - name: Audit the released dependency set for known CVEs
        run: pip-audit --strict --desc -r release-lock.txt -f json -o pip-audit.json || (cat pip-audit.json; exit 1)

      - name: SBOM (CycloneDX) for the released environment
        run: cyclonedx-py environment /tmp/release-env/bin/python --of JSON -o sbom.cdx.json

      - name: Secret scan (content, not filenames)
        # High-entropy plugins are disabled: the repository legitimately stores
        # SHA-256 digests (fixtures, qualification record) that they flag.
        run: |
          detect-secrets scan --all-files \
            --disable-plugin HexHighEntropyString \
            --disable-plugin Base64HighEntropyString > secrets-scan.json
          python -c "import json,sys; r=json.load(open('secrets-scan.json'))['results']; print(json.dumps(r, indent=2)); sys.exit(1 if r else 0)"

      - name: Retain release security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-evidence
          path: |
            release-lock.txt
            release-artifacts.sha256
            pip-audit.json
            sbom.cdx.json
            secrets-scan.json

  package:
    name: wheel installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install into a clean environment and smoke-test
        # Runs from /tmp, NOT the source tree: an editable install or a stray
        # sys.path entry would otherwise hide a broken distribution. This is
        # exactly how the missing py-modules / active_inference packaging bug
        # escaped notice.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          cd /tmp
          /tmp/verify/bin/python -c "
          from pipeline import APGIPipeline
          from config import CONFIG
          import active_inference.policy, core.rng
          p = APGIPipeline({**CONFIG, 'seed': 42})
          r = p.step(x_e=0.5, x_hat_e=0.3, x_i=0.2, x_hat_i=0.1)
          assert set(['S', 'theta', 'B']) <= set(r), r.keys()
          print('wheel import + step OK')
          "
          /tmp/verify/bin/apgi --steps 20 --seed 1

      - name: Installed wheel qualifies itself outside the source tree
        # AUD-DEF-07: the frozen vectors and qualification record are package
        # data; verification must not depend on files only present in a checkout.
        run: |
          /tmp/verify/bin/pip install "$(ls dist/*.whl)[sci]"
          cd /tmp
          /tmp/verify/bin/python -m qualification.reference

  reproducibility:
    name: seeded runs are bit-for-bit reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Verify determinism
        # The property this repository exists to provide. Guarding it in CI
        # means a future RNG regression fails the build rather than quietly
        # invalidating published figures. The second file adds the cross-process
        # check under different PYTHONHASHSEED values (gate: seeded repeatability).
        run: pytest tests/test_reproducibility.py tests/test_ci_gates.py -m "conformance or repeatability" -v

  # --- Gates for apgi-implementation (XC-CI-02) -----------------------------
  # Each is a separately named job so branch protection can require it
  # individually: numerical-parity, stability, performance, reproducibility
  # (seeded repeatability), k7c-recovery-smoke. See docs/CI-GATES.md.

  numerical-parity:
    name: numerical parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Independent implementations agree
        run: pytest tests/ -m parity -v

  stability:
    name: stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Bounded and finite at extremes
        run: pytest tests/ -m stability -v

  performance:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Throughput floors
        # No --cov: tracing would distort the measurement.
        run: pytest tests/ -m performance -v -p no:cacheprovider

  k7c-recovery-smoke:
    name: K7c recovery smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Small recovery simulation
        run: pytest tests/ -m recovery_smoke -v

  dependency-policy:
    name: dependency policy and qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Acyclic graph, pinned packages, no copied models, deprecations listed
        run: python tools/check_dependencies.py
      - name: apgi_reduced qualification record is current
        run: python -m qualification.reference

  estimation-pymc:
    name: PyMC model matches the numpy reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyMC in its own environment
        # PyMC/PyTensor releases require numpy>=2, which pyproject.toml caps below
        # for the published figures, so this job does not `pip install -e .`; the
        # modules under test import only numpy/scipy/pymc and run from the source tree.
        run: |
          python -m pip install --upgrade pip
          pip install pymc scipy pytest structlog pydantic
      - name: logp parity and a short NUTS run
        run: PYTHONPATH=. pytest tests/test_estimation_pymc.py -v -p no:cacheprovider -o addopts="" -W ignore
