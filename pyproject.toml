[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "apgi"
version = "1.1.0"
description = "Allostatic Precision-Gated Ignition (APGI): reference implementation of the computational framework"
readme = "README.md"
# 3.10+, not 3.9. The codebase uses PEP 604 unions in RUNTIME positions, not
# just annotations — e.g. core/sde.py's module-level
# `NumberOrFn = float | Callable[[float, float], float]`, which raises
# TypeError on 3.9 regardless of `from __future__ import annotations`. The
# previous ">=3.9" claim would have failed at import on a 3.9 install.
requires-python = ">=3.10"
# PEP 639: SPDX expression + explicit license file, so the wheel actually
# carries LICENSE. Previously the project declared MIT with no LICENSE file
# present at all.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["neuroscience", "computational-model", "precision-weighting", "ignition"]
authors = [
    {name = "Dimitry Pesochin", email = "dimitry@apgiframework.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    # No "License ::" classifier: PEP 639 supersedes it with the `license`
    # SPDX field above, and declaring both is an error under setuptools>=77.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Upper bounds are deliberate. This package is a DOI-archived replication
# artifact: a future major release of numpy/pydantic that changes numerical
# or validation behaviour would silently alter published figures. Bounds are
# raised only after the test suite and the golden-master figure regression
# pass against the new major version.
dependencies = [
    "numpy>=1.24.0,<2.0",
    "pydantic>=2.0.0,<3.0",
    "structlog>=24.1.0,<26.0",
]
[project.optional-dependencies]
sci = [
    "scipy>=1.10.0,<2.0",
]
reservoir = [
    "scipy>=1.10.0,<2.0",
]
analysis = [
    "scipy>=1.10.0,<2.0",
    "matplotlib>=3.7.0,<4.0",
]
# Optional NUTS estimation (estimation/pymc_models.py). The numpy estimators in
# estimation/fitting.py need only scipy. Recent PyMC/PyTensor releases require
# numpy>=2, which this package caps below; install this extra into an
# environment where that resolves (see DEPENDENCY-MATRIX.md).
estimation = [
    "scipy>=1.10.0,<2.0",
    "pymc>=5.10.0,<7.0",
]
dev = [
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<8.0",
    "pytest-mock>=3.10.0,<4.0",
    "pandas>=2.0.0,<3.0",
    # Exact pins: the lint/format verdict must not depend on when CI resolved.
    "ruff==0.16.0",
    "mypy==1.19.0",
]
all = [
    "scipy>=1.10.0,<2.0",
    "matplotlib>=3.7.0,<4.0",
    "pandas>=2.0.0,<3.0",
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<8.0",
    "pytest-mock>=3.10.0,<4.0",
    "ruff==0.16.0",
    "mypy==1.19.0",
]
[project.scripts]
apgi = "main:main"
[project.urls]
# These MUST match the Data and Code Availability statement in the APGI paper
# series. Three different URLs were previously in circulation (the papers'
# apgiframework/…, pyproject's apgi/apgi, and the actual git remote), so the
# published availability statement pointed at a repository that was not this
# one.
Homepage = "https://github.com/apgiframework/apgi-implementation"
Repository = "https://github.com/apgiframework/apgi-implementation"
Issues = "https://github.com/apgiframework/apgi-implementation/issues"
Zenodo = "https://doi.org/10.5281/zenodo.21632264"
[tool.setuptools.packages.find]
where = ["."]
# active_inference was missing here even though pipeline.py imports it at
# module top level, so `pip install .` produced a package that could not be
# imported.
include = [
    "core*",
    "hierarchy*",
    "oscillation*",
    "reservoir*",
    "stats*",
    "validation*",
    "analysis*",
    "energy*",
    "active_inference*",
    "models*",
    "engine*",
    "estimation*",
    "adapters*",
    "runtime*",
    "model_registry*",
    "qualification*",
]

# pipeline.py, config.py and main.py are top-level MODULES, not packages, so
# packages.find never collected them. Without this, `pip install .` shipped a
# distribution where `from pipeline import APGIPipeline` (the README
# quickstart) and the `apgi = "main:main"` console script both failed.
# Editable installs masked the problem by putting the source tree on sys.path.
[tool.setuptools]
py-modules = ["pipeline", "config", "main"]
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # line length is handled by the formatter

    # --- pep8-naming, deliberately disabled ---------------------------------
    # This codebase mirrors the APGI specification's notation exactly, and the
    # Notation Appendix treats symbol identity as normative: it devotes whole
    # sections to keeping β_SM distinct from β_somatic and β_DA, κ from κ_meta,
    # H from α_DFA, and Φ reserved for IIT. Code that reads `S`, `W_res`,
    # `Pi_e_eff`, `C`, `V`, `M`, `B_prev`, `N_erase` is directly checkable
    # against the equations; lowercasing it to satisfy PEP 8 would sever that
    # correspondence and make review against the spec materially harder.
    #
    # These are suppressed for the mathematical layer only — the rules that
    # catch genuine defects (F, B, E, UP, SIM, C4, I) all stay enabled.
    "N802", # invalid-function-name — e.g. compute_C_metabolic
    "N803", # invalid-argument-name — e.g. S, C, V, M, N, W_res, B_prev
    "N806", # non-lowercase-variable-in-function — e.g. S_inst, Pi_e_eff, F_arr
    "N815", # mixed-case-variable-in-class-scope — e.g. W_out, W_inh
    "N999", # invalid-module-name — numbered example scripts (01_basic_usage.py)
]

[tool.ruff.lint.per-file-ignores]
# Example scripts are didactic: they import for side effects, print
# intermediate values, and interleave imports with narrative sections.
"examples/*" = ["E402", "F401", "F841", "T201"]
# Tests may shadow, re-import and leave deliberate unused bindings.
"tests/*" = ["E402", "F401", "F841", "B017", "SIM117"]
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
# build/ and dist/ hold copies of the packages, which mypy reports as
# duplicate modules and which abort the whole run.
exclude = ["tests/", "examples/", "build/", "dist/", "delete_pycache.py"]

# Optional, guarded imports with no type stubs. tomli is only needed on Python
# < 3.11 (3.11+ uses stdlib tomllib); mne is only needed for EEG dataset
# loading. Both are imported inside try/except, so their absence is a supported
# configuration rather than a type error.
[[tool.mypy.overrides]]
module = ["tomli", "mne", "mne.*", "pymc", "pymc.*", "pytensor", "pytensor.*", "arviz", "arviz.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
