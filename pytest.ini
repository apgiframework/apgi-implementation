[pytest]
pythonpath = .

# Warning policy: NARROW, and errors by default.
#
# The previous configuration silenced `ignore::UserWarning`, every numpy
# RuntimeWarning, and — specifically — "Config validation failed". That last
# filter made the fail-open validation path invisible to the whole suite: no
# test could assert on it. Combined with blanket numpy suppression, numerical
# degeneracy (overflow, divide-by-zero, invalid value) could never fail a test,
# which is how a 2300-test suite missed the reproducibility, NE-clamp and
# psi-sign defects.
#
# Warnings are errors, with exemptions listed individually and justified.
# LAPACK's DLASCL diagnostics are written straight to stderr and are not
# Python warnings, so they cannot be filtered here at all; the fix is upstream
# input guarding (stats/spectral_extraction.py), not suppression.
filterwarnings =
    error
    ignore::PendingDeprecationWarning
    ignore::DeprecationWarning:pkg_resources.*
    # Deliberate APGI signals that individual tests assert on.
    ignore::core.validation.CanonicalRangeWarning
    ignore::stats.hurst.SpectralRegimeBoundaryWarning

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config --tb=short

markers =
    slow: long-running tests (deselect with '-m "not slow"')
    conformance: asserts a specific clause of the APGI specification
    parity: numerical parity between independent implementations (CI gate: numerical parity)
    stability: bounded, finite behaviour at extremes and under perturbation (CI gate: stability)
    performance: throughput floors, run without coverage tracing (CI gate: performance)
    repeatability: seeded runs reproduce across processes and hash seeds (CI gate: seeded repeatability)
    recovery_smoke: small K7c recovery run (CI gate: K7c recovery smoke test)
